<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Portfolio Model</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">

    <!-- Navbar -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="font-bold text-xl text-gray-900"><i class="fas fa-sliders-h text-amber-600 mr-2"></i>Dashboard Portfolio</h1>
            <div class="flex items-center gap-3">
                <a href="index.html" target="_blank" class="px-4 py-2 border border-gray-300 rounded text-xs font-semibold hover:bg-gray-50"><i class="fas fa-external-link-alt mr-1"></i> Pratinjau</a>
                <button onclick="saveAllData()" class="px-5 py-2 bg-gray-800 text-white rounded text-xs font-semibold hover:bg-gray-900 shadow-sm"><i class="fas fa-save mr-1"></i> Simpan Draf</button>
            </div>
        </div>
    </header>

    <div class="max-w-6xl mx-auto px-6 py-8">
        
        <!-- Status Notification -->
        <div id="status-banner" class="hidden mb-6 p-4 rounded text-sm"></div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Left Panel: Profile & Compcard -->
            <div class="lg:col-span-7 space-y-6">
                
                <!-- General Info -->
                <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                    <h2 class="font-bold text-lg text-gray-900 mb-4 pb-2 border-b"><i class="fas fa-user mr-2 text-amber-600"></i> Informasi Profil Utama</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Nama Lengkap Model</label>
                            <input type="text" id="input-name" class="w-full px-3 py-2 border rounded text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Kategori / Tagline</label>
                            <input type="text" id="input-category" class="w-full px-3 py-2 border rounded text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Bio Singkat</label>
                            <textarea id="input-bio" rows="3" class="w-full px-3 py-2 border rounded text-sm focus:ring-2 focus:ring-amber-500 outline-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Foto Utama (Primary Photo)</label>
                            <div class="flex gap-2">
                                <input type="text" id="input-primary-photo" placeholder="https://..." class="w-full px-3 py-2 border rounded text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                                <label class="px-4 py-2 bg-gray-200 text-gray-700 text-xs font-semibold rounded cursor-pointer hover:bg-gray-300 flex items-center shrink-0">
                                    Upload <input type="file" accept="image/*" class="hidden" onchange="handleFileUpload(event, 'input-primary-photo', 'preview-primary')">
                                </label>
                            </div>
                            <div class="mt-3">
                                <img id="preview-primary" src="" class="h-40 object-cover rounded border">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Compcard Specifications -->
                <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                    <h2 class="font-bold text-lg text-gray-900 mb-4 pb-2 border-b"><i class="fas fa-ruler-combined mr-2 text-amber-600"></i> Data Digital Compcard</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Tinggi Badan</label>
                            <input type="text" id="comp-height" placeholder="172 cm" class="w-full px-3 py-2 border rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Berat Badan</label>
                            <input type="text" id="comp-weight" placeholder="52 kg" class="w-full px-3 py-2 border rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Lingkar Dada</label>
                            <input type="text" id="comp-bust" placeholder="84 cm" class="w-full px-3 py-2 border rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Lingkar Pinggang</label>
                            <input type="text" id="comp-waist" placeholder="64 cm" class="w-full px-3 py-2 border rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Lingkar Pinggul</label>
                            <input type="text" id="comp-hips" placeholder="90 cm" class="w-full px-3 py-2 border rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Ukuran Sepatu</label>
                            <input type="text" id="comp-shoe" placeholder="39 EU" class="w-full px-3 py-2 border rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Style Hijab</label>
                            <input type="text" id="comp-hijab" placeholder="Modern / Clean Hijab" class="w-full px-3 py-2 border rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Warna Mata</label>
                            <input type="text" id="comp-eyes" placeholder="Cokelat Tua" class="w-full px-3 py-2 border rounded text-sm">
                        </div>
                    </div>
                </div>

                <!-- Contact Data -->
                <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                    <h2 class="font-bold text-lg text-gray-900 mb-4 pb-2 border-b"><i class="fas fa-address-book mr-2 text-amber-600"></i> Informasi Kontak & Domisili</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">No WhatsApp (Pakai Kode Negara)</label>
                            <input type="text" id="contact-wa" placeholder="6281234567890" class="w-full px-3 py-2 border rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Email Booking</label>
                            <input type="email" id="contact-email" placeholder="email@domain.com" class="w-full px-3 py-2 border rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Username Instagram (tanpa @)</label>
                            <input type="text" id="contact-ig" placeholder="username" class="w-full px-3 py-2 border rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Domisili / Wilayah Kerjasama</label>
                            <input type="text" id="contact-location" placeholder="Jakarta, Indonesia" class="w-full px-3 py-2 border rounded text-sm">
                        </div>
                    </div>
                </div>

            </div>

            <!-- Right Panel: Portfolio Gallery Manager & Deployment Sync -->
            <div class="lg:col-span-5 space-y-6">

                <!-- Gallery Manager -->
                <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                    <h2 class="font-bold text-lg text-gray-900 mb-4 pb-2 border-b flex justify-between items-center">
                        <span><i class="fas fa-images mr-2 text-amber-600"></i> Galeri Portfolio</span>
                    </h2>

                    <!-- Form Add New Image -->
                    <div class="bg-gray-50 p-4 rounded border mb-4 space-y-3">
                        <h3 class="text-xs font-bold uppercase text-gray-700">Tambah Foto Baru</h3>
                        <div>
                            <input type="text" id="new-photo-title" placeholder="Judul / Nama Client / Brand" class="w-full px-3 py-1.5 border rounded text-xs mb-2">
                            <div class="flex gap-2">
                                <input type="text" id="new-photo-url" placeholder="URL Foto atau Upload..." class="w-full px-3 py-1.5 border rounded text-xs">
                                <label class="px-3 py-1.5 bg-gray-200 text-gray-700 text-xs font-semibold rounded cursor-pointer hover:bg-gray-300 flex items-center shrink-0">
                                    Upload <input type="file" accept="image/*" class="hidden" onchange="handleFileUpload(event, 'new-photo-url', null)">
                                </label>
                            </div>
                        </div>
                        <button onclick="addGalleryItem()" class="w-full py-2 bg-gray-900 text-white rounded text-xs font-semibold hover:bg-gray-800"><i class="fas fa-plus mr-1"></i> Tambahkan ke Galeri</button>
                    </div>

                    <!-- Gallery List -->
                    <div id="dashboard-gallery-list" class="space-y-3 max-h-96 overflow-y-auto pr-1">
                        <!-- Dynamic Item List -->
                    </div>
                </div>

                <!-- GitHub Integration Panel -->
                <div class="bg-amber-50 p-6 rounded-lg shadow-sm border border-amber-200">
                    <h2 class="font-bold text-sm text-amber-900 mb-2"><i class="fab fa-github mr-2"></i> Integrasi Deploy GitHub Pages</h2>
                    
                    <!-- State 1: Form Input Kredensial -->
                    <div id="gh-config-form" class="space-y-3">
                        <p class="text-xs text-amber-800 mb-3">Masukkan kredensial GitHub Anda <b>sekali saja</b>. Data akan tersimpan aman di browser ini.</p>
                        <input type="text" id="gh-user" placeholder="GitHub Username (cth: username)" class="w-full px-3 py-2 border rounded text-xs bg-white">
                        <input type="text" id="gh-repo" placeholder="Nama Repositori (cth: hijab-portfolio)" class="w-full px-3 py-2 border rounded text-xs bg-white">
                        <input type="password" id="gh-token" placeholder="GitHub Personal Access Token (PAT)" class="w-full px-3 py-2 border rounded text-xs bg-white">
                        <button onclick="saveGitHubCredentials()" class="w-full py-2.5 mt-2 bg-amber-800 text-white rounded text-xs font-bold hover:bg-amber-900">
                            <i class="fas fa-key mr-1"></i> Simpan Akses GitHub
                        </button>
                    </div>

                    <!-- State 2: Status Terhubung -->
                    <div id="gh-connected-status" class="hidden space-y-3">
                        <div class="flex items-center justify-between p-3 bg-emerald-100 border border-emerald-300 rounded text-emerald-800 text-xs font-medium">
                            <span><i class="fas fa-check-circle mr-1 text-emerald-600"></i> Terhubung: <strong id="status-repo-name">-</strong></span>
                            <button onclick="resetGitHubCredentials()" class="text-emerald-900 underline hover:text-red-600 text-[11px]">Ubah Token</button>
                        </div>
                        
                        <div class="flex gap-2 mt-4">
                            <button onclick="commitToGitHub()" class="flex-1 py-3 bg-amber-700 text-white rounded text-xs font-bold hover:bg-amber-800 shadow-sm flex items-center justify-center gap-2 transition transform active:scale-95">
                                <i class="fas fa-cloud-upload-alt text-base"></i> Update & Push ke GitHub
                            </button>
                            <button onclick="downloadJSON()" class="px-4 py-3 border border-amber-700 text-amber-800 rounded text-xs font-semibold hover:bg-amber-100" title="Download data.json Manual">
                                <i class="fas fa-download"></i>
                            </button>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script>
        let currentData = {
            name: "", category: "", bio: "", primaryPhoto: "",
            compcard: {}, gallery: [], contact: {}
        };

        // 1. Initialize Data on Load
        window.addEventListener('DOMContentLoaded', () => {
            const savedData = localStorage.getItem('hijab_model_portfolio_data');
            if(savedData) {
                currentData = JSON.parse(savedData);
                populateDashboard(currentData);
            } else {
                fetch('data.json').then(res => res.json()).then(data => {
                    currentData = data;
                    populateDashboard(data);
                }).catch(() => {
                    populateDashboard(currentData);
                });
            }

            // Check if GitHub token exists
            checkSavedGitHubCredentials();
        });

        // 2. Populate Form with Data
        function populateDashboard(data) {
            document.getElementById('input-name').value = data.name || '';
            document.getElementById('input-category').value = data.category || '';
            document.getElementById('input-bio').value = data.bio || '';
            document.getElementById('input-primary-photo').value = data.primaryPhoto || '';
            document.getElementById('preview-primary').src = data.primaryPhoto || '';

            const c = data.compcard || {};
            document.getElementById('comp-height').value = c.height || '';
            document.getElementById('comp-weight').value = c.weight || '';
            document.getElementById('comp-bust').value = c.bust || '';
            document.getElementById('comp-waist').value = c.waist || '';
            document.getElementById('comp-hips').value = c.hips || '';
            document.getElementById('comp-shoe').value = c.shoe || '';
            document.getElementById('comp-hijab').value = c.hijab || '';
            document.getElementById('comp-eyes').value = c.eyes || '';

            const cnt = data.contact || {};
            document.getElementById('contact-wa').value = cnt.whatsapp || '';
            document.getElementById('contact-email').value = cnt.email || '';
            document.getElementById('contact-ig').value = cnt.instagram || '';
            document.getElementById('contact-location').value = cnt.location || '';

            renderGalleryList();
        }

        // 3. Update 'currentData' from Form
        function collectFormData() {
            currentData.name = document.getElementById('input-name').value;
            currentData.category = document.getElementById('input-category').value;
            currentData.bio = document.getElementById('input-bio').value;
            currentData.primaryPhoto = document.getElementById('input-primary-photo').value;

            currentData.compcard = {
                height: document.getElementById('comp-height').value,
                weight: document.getElementById('comp-weight').value,
                bust: document.getElementById('comp-bust').value,
                waist: document.getElementById('comp-waist').value,
                hips: document.getElementById('comp-hips').value,
                shoe: document.getElementById('comp-shoe').value,
                hijab: document.getElementById('comp-hijab').value,
                eyes: document.getElementById('comp-eyes').value,
            };

            currentData.contact = {
                whatsapp: document.getElementById('contact-wa').value,
                email: document.getElementById('contact-email').value,
                instagram: document.getElementById('contact-ig').value,
                location: document.getElementById('contact-location').value,
            };
        }

        // 4. Gallery Functions
        function renderGalleryList() {
            const container = document.getElementById('dashboard-gallery-list');
            if(!currentData.gallery) currentData.gallery = [];
            
            container.innerHTML = currentData.gallery.map((item, index) => `
                <div class="flex items-center gap-3 p-2 border rounded bg-white">
                    <img src="${item.url}" class="w-12 h-12 object-cover rounded">
                    <div class="flex-1 min-w-0">
                        <p class="text-xs font-semibold truncate">${item.title || 'Foto Galeri'}</p>
                    </div>
                    <button onclick="removeGalleryItem(${index})" class="text-red-500 hover:text-red-700 p-2 text-xs"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
        }

        function addGalleryItem() {
            const title = document.getElementById('new-photo-title').value;
            const url = document.getElementById('new-photo-url').value;
            if(!url) return alert('URL foto tidak boleh kosong!');
            
            if(!currentData.gallery) currentData.gallery = [];
            currentData.gallery.push({ title: title || 'Photoshoot', url: url });
            
            document.getElementById('new-photo-title').value = '';
            document.getElementById('new-photo-url').value = '';
            renderGalleryList();
        }

        function removeGalleryItem(index) {
            currentData.gallery.splice(index, 1);
            renderGalleryList();
        }

        // 5. Image Compression & Base64 Converter
        function handleFileUpload(event, targetInputId, previewImgId) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxDim = 1200;
                    let w = img.width, h = img.height;
                    if (w > maxDim || h > maxDim) {
                        if (w > h) { h *= maxDim / w; w = maxDim; }
                        else { w *= maxDim / h; h = maxDim; }
                    }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    const resizedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    
                    document.getElementById(targetInputId).value = resizedDataUrl;
                    if(previewImgId) document.getElementById(previewImgId).src = resizedDataUrl;
                }
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 6. Data Saving Handlers
        function saveAllData() {
            collectFormData();
            localStorage.setItem('hijab_model_portfolio_data', JSON.stringify(currentData));
            showBanner('Draf berhasil disimpan secara lokal! Anda bisa melihat di halaman pratinjau.', 'bg-gray-100 text-gray-800 border-gray-300');
        }

        function downloadJSON() {
            collectFormData();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentData, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "data.json");
            dlAnchorElem.click();
        }

        function showBanner(msg, classes) {
            const b = document.getElementById('status-banner');
            b.className = `mb-6 p-4 rounded text-sm border font-medium ${classes}`;
            b.textContent = msg;
            b.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 7. GitHub Integrations Logic
        function checkSavedGitHubCredentials() {
            const user = localStorage.getItem('gh_user');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');

            const formEl = document.getElementById('gh-config-form');
            const statusEl = document.getElementById('gh-connected-status');

            if (user && repo && token) {
                formEl.classList.add('hidden');
                statusEl.classList.remove('hidden');
                document.getElementById('status-repo-name').textContent = `${user}/${repo}`;
            } else {
                formEl.classList.remove('hidden');
                statusEl.classList.add('hidden');
            }
        }

        function saveGitHubCredentials() {
            const user = document.getElementById('gh-user').value.trim();
            const repo = document.getElementById('gh-repo').value.trim();
            const token = document.getElementById('gh-token').value.trim();

            if(!user || !repo || !token) {
                return alert('Lengkapi semua data kredensial GitHub terlebih dahulu!');
            }

            localStorage.setItem('gh_user', user);
            localStorage.setItem('gh_repo', repo);
            localStorage.setItem('gh_token', token);

            showBanner('Kredensial GitHub berhasil disimpan di browser!', 'bg-emerald-100 text-emerald-800 border-emerald-300');
            checkSavedGitHubCredentials();
        }

        function resetGitHubCredentials() {
            if(confirm('Apakah Anda yakin ingin menghapus token tersimpan? Anda harus login ulang nantinya.')) {
                localStorage.removeItem('gh_user');
                localStorage.removeItem('gh_repo');
                localStorage.removeItem('gh_token');
                
                document.getElementById('gh-user').value = '';
                document.getElementById('gh-repo').value = '';
                document.getElementById('gh-token').value = '';
                
                checkSavedGitHubCredentials();
            }
        }

        async function commitToGitHub() {
            saveAllData();

            const user = localStorage.getItem('gh_user');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');

            if(!user || !repo || !token) {
                return alert('Kredensial GitHub tidak ditemukan. Silakan masukkan token terlebih dahulu.');
            }

            showBanner('Sedang mengirim pembaruan ke GitHub Repository...', 'bg-blue-100 text-blue-800 border-blue-300');

            const filePath = 'data.json';
            const url = `https://api.github.com/repos/${user}/${repo}/contents/${filePath}`;
            const jsonString = JSON.stringify(currentData, null, 2);
            const contentEncoded = btoa(unescape(encodeURIComponent(jsonString)));

            try {
                let sha = "";
                const getRes = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
                if(getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                }

                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `Update portfolio content via dashboard`,
                        content: contentEncoded,
                        sha: sha ? sha : undefined
                    })
                });

                if(putRes.ok) {
                    showBanner('SUKSES! Data berhasil di-update ke GitHub. Halaman portfolio akan berubah otomatis dalam 1-2 menit.', 'bg-green-100 text-green-800 border-green-300');
                } else {
                    const errErr = await putRes.json();
                    showBanner(`Gagal Sync GitHub: ${errErr.message}. Coba periksa kembali Token Anda.`, 'bg-red-100 text-red-800 border-red-300');
                }
            } catch(err) {
                showBanner(`Terjadi kesalahan koneksi: ${err.message}`, 'bg-red-100 text-red-800 border-red-300');
            }
        }
    </script>
</body>
</html>
