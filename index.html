<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Model Portfolio</title>
<meta name="description" content="Portfolio modelling — compcard, gallery, dan kontak booking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAFAF8;
    --paper-dim:#F1EFEA;
    --ink:#141414;
    --ink-soft:#57534A;
    --line:#DEDAD2;
    --signal:#B3261E;
    --signal-soft:rgba(179,38,30,.08);
    --maxw:1180px;
    --gutter:clamp(20px, 5vw, 64px);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;}
  .display{font-family:'Bodoni Moda',serif;}
  .mono{font-family:'Space Mono',monospace;}
  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--signal);
  }
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 var(--gutter);}

  /* crop marks — signature motif borrowed from print compcards */
  .crop{position:relative;}
  .crop::before,.crop::after,
  .crop > .cm-tl, .crop > .cm-br{position:absolute; width:14px; height:14px; pointer-events:none;}
  .crop::before{content:"";top:-1px; left:-1px; border-top:1px solid var(--ink); border-left:1px solid var(--ink);}
  .crop::after{content:"";bottom:-1px; right:-1px; border-bottom:1px solid var(--ink); border-right:1px solid var(--ink);}

  /* ---------- NAV ---------- */
  header.site{
    position:sticky; top:0; z-index:40;
    background:rgba(250,250,248,.88);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    max-width:var(--maxw); margin:0 auto; padding:16px var(--gutter);
    display:flex; align-items:center; justify-content:space-between;
  }
  .nav-name{font-family:'Bodoni Moda',serif; font-weight:500; font-size:18px; letter-spacing:.02em;}
  .nav-links{display:flex; gap:28px; list-style:none; margin:0; padding:0;}
  .nav-links a{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.12em;
    text-transform:uppercase; text-decoration:none; color:var(--ink-soft);
    padding-bottom:4px; border-bottom:1px solid transparent; transition:.2s;
  }
  .nav-links a:hover{color:var(--ink); border-color:var(--signal);}
  .nav-toggle{display:none; background:none; border:none; cursor:pointer; padding:4px;}
  .nav-toggle span{display:block; width:22px; height:1px; background:var(--ink); margin:5px 0;}
  @media (max-width:760px){
    .nav-links{
      position:fixed; inset:0 0 0 auto; top:57px; height:calc(100vh - 57px);
      width:72%; max-width:320px; background:var(--paper); flex-direction:column;
      padding:32px var(--gutter); gap:24px; border-left:1px solid var(--line);
      transform:translateX(100%); transition:transform .3s ease; margin:0;
    }
    .nav-links.open{transform:translateX(0);}
    .nav-toggle{display:block;}
  }

  /* ---------- HERO ---------- */
  .hero{
    display:grid; grid-template-columns:1fr; 
  }
  @media (min-width:860px){
    .hero{grid-template-columns:.85fr 1.15fr; align-items:stretch; min-height:calc(100vh - 58px);}
  }
  .hero-text{
    display:flex; flex-direction:column; justify-content:center;
    padding:56px var(--gutter);
    order:2;
  }
  .hero-photo{order:1; position:relative; overflow:hidden; background:var(--paper-dim); min-height:52vh;}
  @media (min-width:860px){
    .hero-text{order:1;}
    .hero-photo{order:2; min-height:100%;}
  }
  .hero-photo img{width:100%; height:100%; object-fit:cover; min-height:52vh;}
  .hero-photo .crop::before,.hero-photo .crop::after{border-color:#fff;}
  .hero-index{
    font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-soft);
    letter-spacing:.14em; margin-bottom:18px;
  }
  h1.hero-title{
    font-size:clamp(40px, 7vw, 76px); line-height:.98; margin:0 0 18px; font-weight:500;
  }
  h1.hero-title em{color:var(--signal); font-style:italic;}
  .hero-tagline{font-size:16px; color:var(--ink-soft); max-width:38ch; line-height:1.6; margin:0 0 28px;}
  .hero-cta{display:flex; gap:14px; flex-wrap:wrap;}
  .btn{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    text-decoration:none; padding:14px 24px; border:1px solid var(--ink); color:var(--ink);
    transition:.2s; display:inline-block;
  }
  .btn:hover{background:var(--ink); color:var(--paper);}
  .btn.primary{background:var(--ink); color:var(--paper);}
  .btn.primary:hover{background:var(--signal); border-color:var(--signal);}

  /* ---------- SECTION SHELL ---------- */
  section{padding:88px 0;}
  .section-head{margin-bottom:44px;}
  .section-head h2{
    font-family:'Bodoni Moda',serif; font-weight:500; font-size:clamp(30px,4vw,44px);
    margin:10px 0 0;
  }
  .section-head p{color:var(--ink-soft); max-width:56ch; margin:14px 0 0; line-height:1.7;}
  .rule{border:none; border-top:1px solid var(--line); margin:0;}

  /* ---------- COMPCARD ---------- */
  .compcard{
    display:grid; grid-template-columns:1fr; gap:0;
    border:1px solid var(--line); background:var(--paper);
  }
  @media (min-width:760px){ .compcard{grid-template-columns:.9fr 1.1fr;} }
  .cc-photo{background:var(--paper-dim); aspect-ratio:3/4; overflow:hidden;}
  .cc-photo img{width:100%; height:100%; object-fit:cover;}
  .cc-data{padding:36px var(--gutter);}
  .cc-bio{color:var(--ink-soft); line-height:1.75; font-size:14.5px; margin:0 0 28px; padding-bottom:28px; border-bottom:1px solid var(--line);}
  .cc-stats{display:grid; grid-template-columns:repeat(2,1fr); gap:0;}
  .cc-stat{padding:14px 0; border-bottom:1px solid var(--line);}
  .cc-stat:nth-child(odd){padding-right:16px;}
  .cc-stat:nth-child(even){padding-left:16px; border-left:1px solid var(--line);}
  .cc-stat .lbl{
    font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-soft); display:block; margin-bottom:4px;
  }
  .cc-stat .val{font-family:'Space Mono',monospace; font-size:16px; font-weight:700;}

  /* ---------- GALLERY ---------- */
  .gallery-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    grid-auto-rows:8px; gap:var(--gutter-sm,16px);
  }
  .g-item{
    position:relative; overflow:hidden; cursor:zoom-in; background:var(--paper-dim);
    border:1px solid var(--line);
  }
  .g-item img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s ease;}
  .g-item:hover img{transform:scale(1.045);}
  .g-frame{
    position:absolute; bottom:10px; left:10px; font-family:'Space Mono',monospace;
    font-size:10px; letter-spacing:.08em; color:#fff; background:rgba(20,20,20,.55);
    padding:3px 8px; opacity:0; transition:opacity .25s;
  }
  .g-item:hover .g-frame{opacity:1;}
  .gallery-empty{color:var(--ink-soft); font-family:'Space Mono',monospace; font-size:13px; padding:40px 0;}

  /* Lightbox */
  .lightbox{
    position:fixed; inset:0; background:rgba(15,14,12,.96); z-index:100;
    display:none; align-items:center; justify-content:center; padding:24px;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:min(92vw,1000px); max-height:84vh; object-fit:contain; border:1px solid #333;}
  .lb-close,.lb-prev,.lb-next{
    position:absolute; background:none; border:none; color:#fff; cursor:pointer;
    font-family:'Space Mono',monospace; font-size:13px; letter-spacing:.1em;
  }
  .lb-close{top:24px; right:var(--gutter);}
  .lb-prev{left:var(--gutter); top:50%; transform:translateY(-50%); font-size:28px;}
  .lb-next{right:var(--gutter); top:50%; transform:translateY(-50%); font-size:28px;}
  .lb-count{position:absolute; bottom:24px; left:50%; transform:translateX(-50%); color:#aaa; font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.1em;}

  /* ---------- CONTACT ---------- */
  .contact-wrap{
    display:grid; grid-template-columns:1fr; gap:40px;
    border:1px solid var(--line); padding:var(--gutter);
  }
  @media (min-width:820px){ .contact-wrap{grid-template-columns:1.1fr .9fr;} }
  .contact-statement{font-family:'Bodoni Moda',serif; font-size:clamp(24px,3vw,34px); line-height:1.25; margin:0;}
  .contact-statement .dot{color:var(--signal);}
  .contact-tiles{display:grid; gap:1px; background:var(--line); border:1px solid var(--line);}
  .c-tile{
    background:var(--paper); padding:20px 22px; text-decoration:none; color:var(--ink);
    display:flex; align-items:center; justify-content:space-between; transition:.2s;
  }
  .c-tile:hover{background:var(--signal-soft);}
  .c-tile .lbl{font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft);}
  .c-tile .v{font-size:15px; margin-top:4px; word-break:break-word;}
  .c-tile .arrow{font-family:'Space Mono',monospace; font-size:16px; color:var(--signal); flex-shrink:0; margin-left:12px;}

  footer{
    border-top:1px solid var(--line); padding:32px var(--gutter);
    display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between;
    font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-soft); letter-spacing:.06em;
  }

  [data-reveal]{opacity:0; transform:translateY(18px); transition:opacity .6s ease, transform .6s ease;}
  [data-reveal].is-visible{opacity:1; transform:translateY(0);}
  @media (prefers-reduced-motion:reduce){
    [data-reveal]{opacity:1; transform:none; transition:none;}
    html{scroll-behavior:auto;}
    .g-item img{transition:none;}
  }
</style>
</head>
<body>

<header class="site">
  <nav class="nav wrap">
    <span class="nav-name" id="navName">—</span>
    <ul class="nav-links" id="navLinks">
      <li><a href="#compcard">Compcard</a></li>
      <li><a href="#gallery">Gallery</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <button class="nav-toggle" id="navToggle" aria-label="Buka menu"><span></span><span></span><span></span></button>
  </nav>
</header>

<section class="hero">
  <div class="hero-text wrap" style="padding-left:0;padding-right:0;">
    <div class="hero-index mono">N&deg;01 &mdash; <span id="heroLocation">—</span></div>
    <h1 class="hero-title display" id="heroName">Loading<em>.</em></h1>
    <p class="hero-tagline" id="heroTagline"></p>
    <div class="hero-cta">
      <a href="#contact" class="btn primary">Booking Inquiry</a>
      <a href="#gallery" class="btn">View Portfolio</a>
    </div>
  </div>
  <div class="hero-photo crop">
    <img id="heroPhoto" src="" alt="Main portfolio photo">
  </div>
</section>

<main class="wrap">

  <section id="compcard" data-reveal>
    <div class="section-head">
      <span class="eyebrow">N&deg;02 — Measurements</span>
      <h2>Compcard</h2>
      <p id="ccBio"></p>
    </div>
    <div class="compcard crop">
      <div class="cc-photo"><img id="ccPhoto" src="" alt="Compcard photo"></div>
      <div class="cc-data">
        <div class="cc-stats" id="ccStats"></div>
      </div>
    </div>
  </section>

  <hr class="rule">

  <section id="gallery" data-reveal>
    <div class="section-head">
      <span class="eyebrow">N&deg;03 — Portfolio</span>
      <h2>Gallery</h2>
      <p>Selected work — editorial, commercial, and test shoots.</p>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </section>

  <hr class="rule">

  <section id="contact" data-reveal>
    <div class="section-head">
      <span class="eyebrow">N&deg;04 — Booking</span>
      <h2>Contact</h2>
    </div>
    <div class="contact-wrap">
      <p class="contact-statement" id="contactStatement">Available for bookings<span class="dot">.</span></p>
      <div class="contact-tiles" id="contactTiles"></div>
    </div>
  </section>

</main>

<footer>
  <span id="footName">—</span>
  <span>Composite &amp; Portfolio — <span id="footYear"></span></span>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">CLOSE ✕</button>
  <button class="lb-prev" id="lbPrev">‹</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-next" id="lbNext">›</button>
  <div class="lb-count" id="lbCount"></div>
</div>

<script>
(async function(){
  const $ = (s,ctx=document)=>ctx.querySelector(s);
  const $$ = (s,ctx=document)=>Array.from(ctx.querySelectorAll(s));

  // ---------- Load data ----------
  let data;
  try{
    const res = await fetch('data.json?_=' + Date.now());
    data = await res.json();
  }catch(e){
    console.error('Gagal memuat data.json', e);
    data = {profile:{name:'Data belum tersedia'},compcard:{},gallery:[],contact:{}};
  }

  const p = data.profile || {};
  const cc = data.compcard || {};
  const gallery = data.gallery || [];
  const contact = data.contact || {};

  document.title = (p.name || 'Model') + ' — Portfolio';
  $('#navName').textContent = p.name || '—';
  $('#footName').textContent = p.name || '—';
  $('#footYear').textContent = new Date().getFullYear();
  $('#heroLocation').textContent = p.location || '';
  $('#heroName').innerHTML = (p.name || 'Model Portfolio').replace(/\s+(\S+)$/, ' <em>$1</em>');
  $('#heroTagline').textContent = p.tagline || '';
  $('#heroPhoto').src = data.mainPhoto || '';
  $('#heroPhoto').alt = p.name || 'Photo';
  $('#ccPhoto').src = data.mainPhoto || '';
  $('#ccBio').textContent = p.bio || '';
  $('#contactStatement').innerHTML = (p.availability || 'Available for bookings') + '<span class="dot">.</span>';

  // ---------- Compcard stats ----------
  const fieldMap = [
    ['height','Height'],['bust','Bust / Chest'],['waist','Waist'],['hips','Hips'],
    ['shoe','Shoe Size'],['dress','Dress Size'],['hair','Hair'],['eyes','Eyes']
  ];
  const statsEl = $('#ccStats');
  fieldMap.forEach(([key,label])=>{
    if(!cc[key]) return;
    const div = document.createElement('div');
    div.className = 'cc-stat';
    div.innerHTML = `<span class="lbl mono">${label}</span><span class="val">${cc[key]}</span>`;
    statsEl.appendChild(div);
  });

  // ---------- Gallery ----------
  const grid = $('#galleryGrid');
  if(!gallery.length){
    grid.innerHTML = '<p class="gallery-empty">Belum ada foto di gallery.</p>';
  } else {
    gallery.forEach((item, i)=>{
      const src = typeof item === 'string' ? item : item.src;
      const caption = typeof item === 'string' ? '' : (item.caption || '');
      const fig = document.createElement('div');
      fig.className = 'g-item';
      fig.dataset.index = i;
      fig.innerHTML = `<img src="${src}" alt="${caption || 'Portfolio photo ' + (i+1)}" loading="lazy">
        <span class="g-frame mono">N&deg;${String(i+1).padStart(2,'0')} / ${String(gallery.length).padStart(2,'0')}</span>`;
      grid.appendChild(fig);

      const img = fig.querySelector('img');
      const setSpan = ()=>{
        const rowH = 8, gap = 16;
        const ratio = img.naturalHeight / img.naturalWidth || 1.3;
        const targetH = fig.clientWidth * ratio;
        const span = Math.ceil((targetH + gap) / (rowH + gap));
        fig.style.gridRowEnd = 'span ' + span;
      };
      if(img.complete) setSpan(); else img.addEventListener('load', setSpan);
      window.addEventListener('resize', setSpan);
    });
  }

  // ---------- Contact tiles ----------
  const tiles = $('#contactTiles');
  const rows = [];
  if(contact.email) rows.push({lbl:'Email', v:contact.email, href:'mailto:' + contact.email});
  if(contact.whatsapp) rows.push({lbl:'WhatsApp', v:'+' + contact.whatsapp.replace(/\D/g,''), href:'https://wa.me/' + contact.whatsapp.replace(/\D/g,'')});
  if(contact.instagram) rows.push({lbl:'Instagram', v:contact.instagram, href:'https://instagram.com/' + contact.instagram.replace('@','')});
  if(contact.phone) rows.push({lbl:'Phone', v:contact.phone, href:'tel:' + contact.phone.replace(/\s/g,'')});
  if(contact.agency) rows.push({lbl:'Agency', v:contact.agency, href:null});
  tiles.innerHTML = rows.map(r=>{
    const inner = `<div><span class="lbl">${r.lbl}</span><div class="v">${r.v}</div></div><span class="arrow">→</span>`;
    return r.href ? `<a class="c-tile" href="${r.href}" target="_blank" rel="noopener">${inner}</a>` : `<div class="c-tile">${inner}</div>`;
  }).join('') || '<p class="gallery-empty">Info kontak belum diisi.</p>';

  // ---------- Mobile nav ----------
  const navToggle = $('#navToggle'), navLinks = $('#navLinks');
  navToggle.addEventListener('click', ()=> navLinks.classList.toggle('open'));
  $$('#navLinks a').forEach(a=> a.addEventListener('click', ()=> navLinks.classList.remove('open')));

  // ---------- Scroll reveal ----------
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('is-visible'); io.unobserve(en.target);} });
  }, {threshold:.12});
  $$('[data-reveal]').forEach(el=> io.observe(el));

  // ---------- Lightbox ----------
  const lb = $('#lightbox'), lbImg = $('#lbImg'), lbCount = $('#lbCount');
  let lbIndex = 0;
  function openLb(i){
    if(!gallery.length) return;
    lbIndex = (i + gallery.length) % gallery.length;
    const item = gallery[lbIndex];
    lbImg.src = typeof item === 'string' ? item : item.src;
    lbCount.textContent = (lbIndex+1) + ' / ' + gallery.length;
    lb.classList.add('open');
  }
  function closeLb(){ lb.classList.remove('open'); }
  grid.addEventListener('click', (e)=>{
    const item = e.target.closest('.g-item');
    if(item) openLb(parseInt(item.dataset.index,10));
  });
  $('#lbClose').addEventListener('click', closeLb);
  $('#lbPrev').addEventListener('click', ()=> openLb(lbIndex-1));
  $('#lbNext').addEventListener('click', ()=> openLb(lbIndex+1));
  lb.addEventListener('click', (e)=>{ if(e.target === lb) closeLb(); });
  document.addEventListener('keydown', (e)=>{
    if(!lb.classList.contains('open')) return;
    if(e.key === 'Escape') closeLb();
    if(e.key === 'ArrowRight') openLb(lbIndex+1);
    if(e.key === 'ArrowLeft') openLb(lbIndex-1);
  });
})();
</script>
</body>
</html>
